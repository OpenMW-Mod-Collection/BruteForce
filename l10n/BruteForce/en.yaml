triggerTrapsOn_bent: Bending a Lock
triggerTrapsOn_missed: Missing
triggerTrapsOn_notLocked: Hitting Unlocked

alerting_group_name: Alerting
alerting_group_desc: |
  Breaking an owned lock can alert NPCs in two ways:

  1. If they're close enough to hear you through walls (duh, hitting locks is loud)

  2. If you fail the vanilla sneak check

  For reference, river Odai in Balmora is around 1000 units wide. And Ra'virr is aroung 600 units away from his locked chest behind the staircase.
soundRange_name: Sound Range
soundRange_desc: |
  Sound distance is calculated as:

  BaseDist - WeaponSkill * WeaponSkillMult
missingIsACrime_name: Missing Counts as a Crime
missingIsACrime_desc: Missing is visible, but doesn't cause any noise.

debug_group_name: Debug
modEnabled_name: Enable Mod
enableMessages_name: Enable Messages
ignoreBentLocks_name: Ignore Bent Locks
unlockWithBrokenWeapons_name: Allow Unlocking with Too Worn or Weak Weapons
unlockWithBrokenWeapons_desc: >
  Weapon is considered too worn or weak if the recieved damage exceeds its current condition.