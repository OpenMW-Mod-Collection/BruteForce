page_name: Brute Force
page_desc: Allows breaking locks with melee weapons.

locks_group_name: Locks
strengthRequirement_name: Strength Requirement
strengthRequirement_desc: >
  To break a lock you need (LockLevel + StrengthRequirement) amount of strength.
minHitChance_name: Minimum Hit Chance
punchDamageMult_name: Fist Damage Multipliers
punchDamageMult_desc: >
  When punching a lock you will recieve (LockLevel * Mult) amount of health damage.
  Respects your armor rating.
bendingChance_name: Chance to Bend the Lock
bendingChance_desc: >
  Bent locks can't be opened with weapons anymore.
  You'd need to use traditional lockpicking methods instead.
weaponWearMult_name: Weapon Wear Multiplier
weaponWearMult_desc: >
  Weapon is worn down by (LockLevel * WeaponWearMult) amount on each hit.
wearWeaponsAgainstBentLocks_name: Wear Weapons Against Bent Locks
damageContents_name: Damage Equipment in Containers
damageContents_desc: Amount of damage ranges from 1 to max durability.
